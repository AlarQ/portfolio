# pnpm 11 reads settings here (no longer the "pnpm" field in package.json).
# allowBuilds gates which deps may run install/build scripts.
allowBuilds:
  core-js-pure: false
  esbuild: true
  sharp: true

# Transitive advisories with no fixed parent release yet (pnpm audit --audit-level
# high is a pre-push gate). Drop an entry once the parent ships the fix itself.
overrides:
  postcss: '>=8.5.18'
  sharp: '>=0.35.0'
  fast-uri: '>=4.1.2'
  brace-expansion: '>=5.0.9'
  nanoid: '>=3.3.18'

# image-size advisories (ICNS / JXL+HEIF parser DoS) - patched version (>=2.0.3)
# is not published yet; dev-only transitive of @storybook/nextjs, never parses
# untrusted input here. Remove once 2.0.3 ships and the override can pin it.
auditConfig:
  ignoreGhsas:
    - GHSA-5p2g-fcmc-qvqq
    - GHSA-w3rx-r6r6-pgpr
